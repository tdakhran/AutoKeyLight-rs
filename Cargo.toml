[package]
name = "autokeylight"
version = "0.1.0"
description = "Turns your Elgato lights on and off with your webcam"
authors = ["Tarek Dakhran <t.dakhran@gmail.com>"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol embeds ui/ into the binary, there's no dev server
tauri = { version = "2", features = ["tray-icon", "image-png", "custom-protocol"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
mdns-sd = "0.21.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com"] }
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
strip = true
