<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoKeyLight</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <main>
      <section class="status">
        <div class="status-row">
          <span class="dot" id="camera-dot"></span>
          <span id="camera-state">Checking camera…</span>
        </div>
      </section>

      <section>
        <h2>Lights</h2>
        <p class="hint">Tracked lights turn on and off with the camera.</p>
        <ul id="lights"></ul>
        <p class="empty" id="no-lights" hidden>Looking for lights on your network…</p>
      </section>

      <section>
        <h2>Delays</h2>
        <label class="field">
          <span>Before turning on</span>
          <span class="number"><input id="on-delay" type="number" min="0" step="100" /> ms</span>
        </label>
        <label class="field">
          <span>Before turning off</span>
          <span class="number"><input id="off-delay" type="number" min="0" step="100" /> ms</span>
        </label>
      </section>

      <section>
        <label class="check">
          <input id="autostart" type="checkbox" />
          <span>Start at login</span>
        </label>
      </section>

      <p class="error" id="error" hidden></p>
    </main>
  </body>
</html>
