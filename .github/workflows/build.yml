# Builds the Windows installer and the macOS disk image. Pushing a tag like v0.1.0 also creates a draft release
# with both attached, the tag should match the version in Cargo.toml.
name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
            installer: target/release/bundle/nsis/*-setup.exe
          # Apple silicon, the disk image doesn't run on Intel Macs
          - name: macos
            runner: macos-latest
            installer: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Caches dependencies and the installed Tauri CLI between runs
      - uses: Swatinem/rust-cache@v2

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        run: cargo tauri build
        env:
          # Skips styling the disk image window through Finder, which needs a logged in desktop
          CI: true

      - uses: actions/upload-artifact@v4
        with:
          name: autokeylight-${{ matrix.name }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installers/*
          generate_release_notes: true
